<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Personal academic website of Ganghun Lee, an undergraduate student at KAIST.">
  <meta name="color-scheme" content="light dark">
  <title>Ganghun Lee | KAIST</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <script>
    try {
      const saved = localStorage.getItem('academic-theme');
      if (saved === 'light' || saved === 'dark') document.documentElement.dataset.theme = saved;
    } catch (_) {}
  </script>
</head>
<body>
  <header class="container site-header">
    <div class="header-main">
      <div class="identity">
        <h1>Ganghun Lee</h1>
        <p class="subtitle">Undergraduate Student, KAIST</p>
        <p class="header-links">
          <a href="https://github.com/hoithoitcat" target="_blank" rel="noopener noreferrer">GitHub</a>
          <span class="dot">·</span>
          <a href="#contact">Contact</a>
        </p>
      </div>
      <!-- Replace the placeholder with <img class="profile-photo" src="assets/profile.jpg" alt="Portrait of Ganghun Lee"> -->
      <div class="profile-photo placeholder" role="img" aria-label="Profile photograph placeholder">GL</div>
    </div>
    <nav aria-label="Primary navigation">
      <a href="#about">About</a>
      <a href="#publications">Publications</a>
      <a href="#activities">Activities</a>
      <a href="#contact">Contact</a>
      <button id="theme-toggle" class="theme-toggle" type="button" aria-label="Toggle color theme">☾</button>
    </nav>
  </header>

  <main class="container">
    <section id="about" class="panel" aria-labelledby="about-title">
      <h2 id="about-title">About</h2>
      <div id="about-content"></div>
    </section>
    <section id="publications" class="panel" aria-labelledby="publications-title">
      <div class="section-head">
        <h2 id="publications-title">Publications</h2>
        <p id="publication-count" class="section-note"></p>
      </div>
      <div id="publication-sections" class="publication-sections"></div>
    </section>
    <section id="activities" class="panel" aria-labelledby="activities-title">
      <h2 id="activities-title">Research and Activities</h2>
      <div id="activities-content"></div>
    </section>
    <section id="contact" class="panel" aria-labelledby="contact-title">
      <h2 id="contact-title">Contact</h2>
      <p>GitHub: <a href="https://github.com/hoithoitcat" target="_blank" rel="noopener noreferrer">github.com/hoithoitcat</a></p>
      <!-- Add an email and CV link here only when you want them published. -->
    </section>
  </main>
  <footer class="container site-footer"><p>© <span id="year">2026</span> Ganghun Lee</p></footer>
  <button class="to-top-button" id="to-top-button" type="button" aria-label="Back to top">↑</button>
  <script type="module" src="app.js"></script>
</body>
</html>
